<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Quizzes | Soccer Pro Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-50 min-h-screen flex flex-col items-center">
  <nav class="bg-[#1e293b]/80 backdrop-blur-md border-b border-white/10 p-4 flex flex-wrap justify-center gap-x-8 gap-y-2 w-full sticky top-0 z-50">
    <a href="../index.html" class="font-sports text-slate-300 hover:text-green-400 transition">HOME</a>
    <a href="index.html" class="font-sports text-green-400 font-bold tracking-widest border-b-2 border-green-400">QUIZZES</a>
    <a href="../resources/index.html" class="font-sports text-slate-300 hover:text-green-400 transition">PLAYBOOK</a>
    <a href="../video-clips.html" class="font-sports text-slate-300 hover:text-green-400 transition">VIDEOS</a>
    <a href="../schedule.html" class="font-sports text-slate-300 hover:text-green-400 transition">SCHEDULE</a>
    <a href="../stats.html" class="font-sports text-slate-300 hover:text-green-400 transition">STATS</a>
  </nav>

  <header class="w-full py-10 bg-gradient-to-b from-blue-900/20 to-[#0f172a] text-center">
    <h1 class="text-4xl md:text-5xl font-bold font-sports italic text-white">Tactical <span class="text-blue-500">Quizzes</span></h1>
    <p class="text-slate-400 font-sports tracking-widest uppercase mt-2">Level Up Your Soccer IQ</p>
  </header>

  <main class="w-full max-w-4xl flex-1 p-6">
    <section class="learning-level mb-10">
      <div>
        <label for="level-picker" class="block font-sports font-bold text-xl mb-2">Learning Level</label>
        <select id="level-picker" disabled>
          <option value="novice">Novice</option><option value="beginner" selected>Beginner</option>
          <option value="intermediate">Intermediate</option><option value="advanced">Advanced</option>
        </select>
        <p id="level-description" class="text-slate-300 mt-3"></p>
      </div>
      <div class="mixed-start">
        <a id="mixed-challenge" class="quiz-button" href="quiz.html?quiz=all&amp;level=beginner" hidden>All-round challenge</a>
        <p class="text-slate-400 text-sm mt-2">10 questions | All topics <span id="mixed-best"></span></p>
      </div>
    </section>

    <section>
      <h2 class="text-2xl font-bold mb-6 font-sports flex items-center gap-3">
        <span class="text-green-500">⚽</span> Topic Practice
      </h2>
      <div id="quiz-list" class="grid gap-6 md:grid-cols-2"><p>Loading quizzes...</p></div>
    </section>

    <section class="mt-12 border-t border-white/10 pt-6">
      <h2 class="text-2xl font-bold mb-6 font-sports">Your Badges</h2>
      <ul id="badge-list" class="badge-list"></ul>
      <p id="save-status" class="text-slate-400 text-sm mt-6" role="status"></p>
      <button id="reset-progress" class="text-red-300 underline mt-4 text-sm" disabled>Reset saved progress</button>
    </section>
  </main>

  <footer class="w-full py-8 text-center text-slate-600 text-sm font-sports">
    &copy; 2025 ELITE SOCCER ACADEMY
  </footer>

  <script src="../js/quiz.js"></script>
  <script src="../js/user.js"></script>
  <script src="../js/landing.js"></script>
</body>
</html>
