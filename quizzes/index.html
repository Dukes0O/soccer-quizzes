<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Quizzes | Soccer Pro Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-50 min-h-screen flex flex-col items-center">
  <nav class="bg-[#1e293b]/80 backdrop-blur-md border-b border-white/10 p-4 flex justify-center space-x-8 w-full sticky top-0 z-50">
    <a href="../index.html" class="font-sports text-slate-300 hover:text-green-400 transition">HOME</a>
    <a href="index.html" class="font-sports text-green-400 font-bold tracking-widest border-b-2 border-green-400">QUIZZES</a>
    <a href="../resources/index.html" class="font-sports text-slate-300 hover:text-green-400 transition">PLAYBOOK</a>
    <a href="../video-clips.html" class="font-sports text-slate-300 hover:text-green-400 transition">VIDEOS</a>
  </nav>

  <header class="w-full py-10 bg-gradient-to-b from-blue-900/20 to-[#0f172a] text-center">
    <h1 class="text-4xl md:text-5xl font-bold font-sports italic text-white">Tactical <span class="text-blue-500">Quizzes</span></h1>
    <p class="text-slate-400 font-sports tracking-widest uppercase mt-2">Level Up Your Soccer IQ</p>
  </header>

  <main class="w-full max-w-4xl flex-1 p-6">
    <section class="mb-12 glass-panel rounded-2xl p-8 border-t-4 border-yellow-500">
      <h2 class="text-2xl font-bold mb-6 font-sports flex items-center gap-3">
        <span class="text-yellow-500">🏆</span> Your Pro Badges
      </h2>
      <div id="badge-list" class="flex flex-wrap gap-4"></div>
    </section>

    <section>
      <h2 class="text-2xl font-bold mb-6 font-sports flex items-center gap-3">
        <span class="text-green-500">⚽</span> Available Challenges
      </h2>
      <div id="quiz-list" class="grid gap-6 md:grid-cols-2"></div>
    </section>

    <section class="mt-12">
      <button onclick="if(confirm('Reset all progress?')) { window.userCore.resetUserProgress(); window.location.reload(); }"
              class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-6 py-2 rounded-full text-sm font-sports transition">
        Reset Academy Progress
      </button>
    </section>
  </main>

  <footer class="w-full py-8 text-center text-slate-600 text-sm font-sports">
    &copy; 2025 ELITE SOCCER ACADEMY
  </footer>

  <script src="../js/user.js"></script>
  <script src="../js/landing.js"></script>
  <script>
    (async function() {
      try {
        const quizzes = await window.landingCore.loadManifest();
        const userProgress = window.userCore.getUserData().progress || {};
        window.landingCore.renderQuizCards(quizzes, userProgress);
        window.landingCore.renderBadges(userProgress, quizzes);
      } catch (err) {
        console.error('Error loading quizzes manifest:', err);
        document.getElementById('quiz-list').innerHTML = '<p class="text-red-400">Failed to load mission data.</p>';
      }
    })();
  </script>
</body>
</html>
