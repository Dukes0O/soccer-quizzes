<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Penalty kick setup</title>
  <desc id="desc">Penalty kick with shooter, goalkeeper, penalty spot, and box spacing.</desc>
  <rect width="900" height="500" fill="#0b5c2a"/>
  <rect x="35" y="35" width="830" height="430" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="670" y="145" width="195" height="210" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="795" y="205" width="70" height="90" fill="none" stroke="#d9f99d" stroke-width="3"/>
  <circle cx="735" cy="250" r="5" fill="#fef08a"/>
  <path d="M670 185 Q610 250 670 315" fill="none" stroke="#d9f99d" stroke-width="3"/>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="735" cy="250" r="18" fill="#22c55e"/><text x="735" y="292" fill="white">BALL</text>
    <circle cx="835" cy="250" r="18" fill="#facc15"/><text x="835" y="285" fill="white">GK</text>
    <circle cx="605" cy="250" r="18" fill="#22c55e"/><text x="605" y="285" fill="white">SHOOTER</text>
    <circle cx="625" cy="155" r="16" fill="#ef4444"/>
    <circle cx="625" cy="345" r="16" fill="#ef4444"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fef08a"/></marker></defs>
  <path d="M620 250 L735 250" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M748 247 C780 225 810 225 833 240" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="450" y="488" fill="#d9f99d" font-family="Inter, Arial, sans-serif" font-size="22" text-anchor="middle">Penalty kick: stay calm, pick a spot, and follow in for rebounds after the kick.</text>
</svg>
