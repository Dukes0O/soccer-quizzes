<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Direct free kick decision</title>
  <desc id="desc">A direct free kick near the box with a wall, keeper, shooter, and passing option.</desc>
  <rect width="900" height="500" fill="#0b5c2a"/>
  <rect x="35" y="35" width="830" height="430" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="670" y="145" width="195" height="210" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="795" y="205" width="70" height="90" fill="none" stroke="#d9f99d" stroke-width="3"/>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="585" cy="255" r="18" fill="#22c55e"/><text x="585" y="292" fill="white">BALL</text>
    <circle cx="635" cy="210" r="16" fill="#22c55e"/><text x="635" y="182" fill="white">PASS</text>
    <circle cx="835" cy="250" r="18" fill="#facc15"/><text x="835" y="285" fill="white">GK</text>
    <circle cx="700" cy="238" r="16" fill="#ef4444"/>
    <circle cx="725" cy="238" r="16" fill="#ef4444"/>
    <circle cx="750" cy="238" r="16" fill="#ef4444"/>
    <circle cx="775" cy="238" r="16" fill="#ef4444"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fef08a"/></marker></defs>
  <path d="M600 250 C675 160 760 155 830 220" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M595 248 C610 230 620 218 635 210" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
  <text x="450" y="488" fill="#d9f99d" font-family="Inter, Arial, sans-serif" font-size="22" text-anchor="middle">Direct free kick: you may shoot, but the best choice still depends on distance, wall, and angle.</text>
</svg>
