<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Goalkeeper distribution options</title>
  <desc id="desc">Goalkeeper has a short pass, wide pass, and long clearance option.</desc>
  <rect width="900" height="500" fill="#0b5c2a"/>
  <rect x="35" y="35" width="830" height="430" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="35" y="145" width="195" height="210" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="35" y="205" width="70" height="90" fill="none" stroke="#d9f99d" stroke-width="3"/>
  <line x1="450" y1="35" x2="450" y2="465" stroke="#d9f99d" stroke-width="3" opacity=".8"/>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="85" cy="250" r="18" fill="#facc15"/><text x="85" y="285" fill="white">GK</text>
    <circle cx="185" cy="170" r="17" fill="#22c55e"/><text x="185" y="145" fill="white">A</text>
    <circle cx="210" cy="330" r="17" fill="#22c55e"/><text x="210" y="375" fill="white">B</text>
    <circle cx="450" cy="255" r="17" fill="#22c55e"/><text x="450" y="295" fill="white">C</text>
    <circle cx="165" cy="250" r="17" fill="#ef4444"/>
    <circle cx="255" cy="205" r="17" fill="#ef4444"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fef08a"/></marker></defs>
  <path d="M100 245 C125 210 155 185 185 170" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M100 260 C135 300 170 325 210 330" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M100 250 C210 240 330 245 450 255" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
  <text x="450" y="488" fill="#d9f99d" font-family="Inter, Arial, sans-serif" font-size="22" text-anchor="middle">Goalkeeper distribution: choose the safest pass that helps the team keep the ball.</text>
</svg>
