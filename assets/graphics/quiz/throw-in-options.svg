<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Throw-in options from the sideline</title>
  <desc id="desc">A throw-in from the lower sideline with goals shown at both ends of the pitch.</desc>
  <rect width="900" height="500" fill="#0b5c2a"/>
  <rect x="45" y="45" width="810" height="390" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <line x1="450" y1="45" x2="450" y2="435" stroke="#d9f99d" stroke-width="3" opacity=".8"/>
  <circle cx="450" cy="240" r="58" fill="none" stroke="#d9f99d" stroke-width="3" opacity=".8"/>
  <rect x="45" y="155" width="120" height="170" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="735" y="155" width="120" height="170" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="28" y="206" width="17" height="68" fill="none" stroke="#fef08a" stroke-width="5"/>
  <rect x="855" y="206" width="17" height="68" fill="none" stroke="#fef08a" stroke-width="5"/>
  <line x1="45" y1="435" x2="855" y2="435" stroke="#fef08a" stroke-width="7"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#fef08a"/>
    </marker>
  </defs>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="650" cy="435" r="18" fill="#22c55e"/><text x="650" y="405" fill="white">THROWER</text>
    <circle cx="610" cy="340" r="17" fill="#22c55e"/><text x="610" y="318" fill="white">A</text>
    <circle cx="705" cy="342" r="17" fill="#22c55e"/><text x="705" y="382" fill="white">B</text>
    <circle cx="555" cy="410" r="17" fill="#22c55e"/><text x="555" y="392" fill="white">C</text>
    <circle cx="585" cy="285" r="17" fill="#ef4444"/>
    <circle cx="640" cy="320" r="17" fill="#ef4444"/>
    <circle cx="735" cy="315" r="17" fill="#ef4444"/>
  </g>
  <path d="M650 416 C640 384 625 360 612 340" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M660 418 C680 385 695 360 704 342" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M637 424 C610 418 585 413 558 410" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
  <text x="450" y="474" fill="#d9f99d" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="middle">Throw-in from the sideline: open feet, down the line, or reset.</text>
</svg>
