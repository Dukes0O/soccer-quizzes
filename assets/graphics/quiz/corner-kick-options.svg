<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Corner kick options</title>
  <desc id="desc">Corner kick from the right with near post, penalty spot, and top of box options.</desc>
  <rect width="900" height="500" fill="#0b5c2a"/>
  <rect x="35" y="35" width="830" height="430" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="35" y="145" width="155" height="210" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <rect x="35" y="195" width="70" height="110" fill="none" stroke="#d9f99d" stroke-width="3"/>
  <path d="M35 465 Q75 465 75 425" fill="none" stroke="#d9f99d" stroke-width="4"/>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="55" cy="445" r="18" fill="#22c55e"/><text x="105" y="452" fill="white">CORNER</text>
    <circle cx="135" cy="215" r="17" fill="#22c55e"/><text x="135" y="190" fill="white">NEAR</text>
    <circle cx="255" cy="250" r="17" fill="#22c55e"/><text x="255" y="222" fill="white">SPOT</text>
    <circle cx="315" cy="360" r="17" fill="#22c55e"/><text x="315" y="400" fill="white">EDGE</text>
    <circle cx="95" cy="250" r="17" fill="#facc15"/><text x="95" y="285" fill="white">GK</text>
    <circle cx="145" cy="245" r="17" fill="#ef4444"/>
    <circle cx="230" cy="260" r="17" fill="#ef4444"/>
    <circle cx="280" cy="335" r="17" fill="#ef4444"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fef08a"/></marker></defs>
  <path d="M66 434 C95 360 115 270 135 215" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M66 442 C120 360 195 285 255 250" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
  <path d="M62 452 C120 430 240 395 315 360" fill="none" stroke="#fef08a" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="4 10"/>
  <text x="450" y="488" fill="#d9f99d" font-family="Inter, Arial, sans-serif" font-size="22" text-anchor="middle">Corners need a plan: attack space, be ready for rebounds, and protect against counters.</text>
</svg>
